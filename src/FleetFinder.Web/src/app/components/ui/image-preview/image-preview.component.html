@if (!innerPreviewImg && images.length === 0) {
  <div class="image-full-size image-preview flex items-center justify-center">
    <div class="wrapper-plug">
      <img src="../../../assets/icons/icon-image.svg" alt="">
    </div>
  </div>
}

@if (innerPreviewImg) {
  <div class="image-full-size image-preview flex items-end justify-end" [style.background-image]="'url(' + innerPreviewImg + ')'">
    <div class="flex gap-4 p-4">
      <app-button theme="green" iconPath="../../../../assets/icons/icon-discket-add.svg" (click)="onConfirm()"/>
      <app-button theme="light-blue" iconPath="../../../assets/icons/icon-cancel-rounded.svg" (click)="onCancel()"/>
    </div>
  </div>
}

@if (images.length > 0 && !innerPreviewImg) {
  <div class="images-container image-full-size">
    @for (url of images; track url) {
      <div class="image-preview __item" [style.background-image]="'url(' + url + ')'" (click)="openViewer(url)"
        [style.cursor]="enableViewer ? 'pointer' : 'default'">
        <div class="remove flex p-4 items-end justify-end h-full">
          @if (mode == 'edit') {
            <app-button theme="red" iconPath="../../../../assets/icons/icon-waste-basket.svg" (click)="onRemove(url)"/>
          }
        </div>
      </div>
    }
  </div>
}

@if (imageViewerService.isOpened$ | async) {
  <app-image-viewer [image]="imageViewer" (closed)="onCloseViewer()"/>
}
