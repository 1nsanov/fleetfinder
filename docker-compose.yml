x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

services:
  fleetfinder.api:
    image: ${DOCKER_REGISTRY-}fleetfinder.api
    container_name: fleetfinder.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=fleetfinder.db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Port=5432;Pooling=true;
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Cors__AllowedOrigins__0=http://localhost:4200
      - Cors__AllowedOrigins__1=http://127.0.0.1:4200
      - Cors__AllowedOrigins__2=http://localhost:${WEB_PORT:-4200}
      - Cors__AllowedOrigins__3=http://127.0.0.1:${WEB_PORT:-4200}
      - S3Storage__ServiceUrl=${S3_SERVICE_URL}
      - S3Storage__PublicBaseUrl=${S3_PUBLIC_BASE_URL}
      - S3Storage__AccessKey=${MINIO_ROOT_USER}
      - S3Storage__SecretKey=${MINIO_ROOT_PASSWORD}
      - S3Storage__Bucket=${S3_BUCKET}
      - Seed__Enabled=${SEED_DEMO_DATA:-true}
      - Seed__DemoPassword=${SEED_DEMO_PASSWORD:-Demo123!}
    build:
      context: .
      dockerfile: ./src/FleetFinder.Api/Dockerfile
    ports:
      - "8100:8080"
    restart: on-failure
    depends_on:
      fleetfinder.db:
        condition: service_healthy
      fleetfinder.minio-init:
        condition: service_completed_successfully

  fleetfinder.web:
    build:
      context: ./src/FleetFinder.Web
      dockerfile: Dockerfile
    container_name: fleetfinder.web
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - fleetfinder.api

  fleetfinder.db:
    image: postgres:17.10
    container_name: fleetfinder.db
    environment:
      <<: *db-env
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5437:5432"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - fleetfinder_postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - db

  fleetfinder.minio:
    image: minio/minio:latest
    container_name: fleetfinder.minio
    environment:
      <<: *minio-env
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    restart: always
    volumes:
      - fleetfinder_minio_data:/data
    networks:
      default:
        aliases:
          - minio

  fleetfinder.minio-init:
    image: minio/mc:latest
    container_name: fleetfinder.minio-init
    depends_on:
      fleetfinder.minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      exit 0;
      "

volumes:
  fleetfinder_postgres_data:
  fleetfinder_minio_data:
