x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

services:
  fleetfinder.api:
    image: ${DOCKER_REGISTRY-}fleetfinder.api
    container_name: fleetfinder.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=fleetfinder.db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Port=5432;Pooling=true;
      - Password__EncryptionKey=${PASSWORD_ENCRYPTION_KEY}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - S3Storage__ServiceUrl=${S3_SERVICE_URL}
      - S3Storage__PublicBaseUrl=${S3_PUBLIC_BASE_URL}
      - S3Storage__AccessKey=${MINIO_ROOT_USER}
      - S3Storage__SecretKey=${MINIO_ROOT_PASSWORD}
      - S3Storage__Bucket=${S3_BUCKET}
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8000:80"
    depends_on:
      fleetfinder.db:
        condition: service_healthy
      fleetfinder.minio-init:
        condition: service_completed_successfully

  fleetfinder.db:
    image: postgres:17.10
    container_name: fleetfinder.db
    environment:
      <<: *db-env
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5437:5432"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - fleetfinder_postgres_data:/var/lib/postgresql/data

  fleetfinder.minio:
    image: minio/minio:latest
    container_name: fleetfinder.minio
    environment:
      <<: *minio-env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - fleetfinder_minio_data:/data

  fleetfinder.minio-init:
    image: minio/mc:latest
    container_name: fleetfinder.minio-init
    depends_on:
      fleetfinder.minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://fleetfinder.minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      exit 0;
      "

volumes:
  fleetfinder_postgres_data:
  fleetfinder_minio_data:
